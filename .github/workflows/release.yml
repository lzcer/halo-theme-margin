name: Release theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tagged source and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync package and theme versions from tag
        run: node scripts/sync-version.mjs

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and package theme
        run: pnpm build

      - name: Generate release notes from commits
        id: notes
        run: node scripts/release-notes.mjs

      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: ${{ steps.notes.outputs.asset }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ASSET"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file work/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          gh release edit "$RELEASE_TAG" --draft=false \
            --prerelease="$PRERELEASE" --title "$RELEASE_TAG" \
            --notes-file work/release-notes.md
