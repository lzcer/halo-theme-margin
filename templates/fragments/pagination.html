<nav
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="pagination(result)"
  class="pagination"
  aria-label="分页"
  th:if="${result.hasPrevious() or result.hasNext()}"
>
  <a th:if="${result.hasPrevious()}" th:href="${result.prevUrl}" rel="prev"
    >← 上一页</a
  >
  <span
    class="pagination-placeholder"
    th:unless="${result.hasPrevious()}"
  ></span>
  <span
    class="pagination-position"
    th:text="${result.page + ' / ' + result.totalPages}"
  ></span>
  <a th:if="${result.hasNext()}" th:href="${result.nextUrl}" rel="next"
    >下一页 →</a
  >
  <span class="pagination-placeholder" th:unless="${result.hasNext()}"></span>
</nav>
